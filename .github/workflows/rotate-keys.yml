# The ComplyRobin rotation runner, every hour. Nothing here needs editing: add your secrets under
# Settings → Secrets and variables → Actions, and the runner does the rest.
#
# Only COMPLYROBIN_TOKEN is always needed; add the others for the services you use and leave the rest out.
name: Rotate keys

on:
  schedule:
    - cron: "17 * * * *"   # every hour; ComplyRobin decides what is actually due
  workflow_dispatch:       # run it by hand, e.g. to test it or after pressing "Rotate now"
    inputs:
      command:
        description: "run rotates what is due; check tests the access and rotates nothing"
        type: choice
        options: [run, check]
        default: run

permissions:
  id-token: write          # only to sign in to AWS or Google Cloud without a stored key (see below)

concurrency:
  group: rotate-keys
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 90    # the runner waits for your app's redeploys to finish before retiring the old key
    steps:
      # Rotating AWS keys, or writing to AWS secrets? Remove the # signs below to sign in with a role, so there is no
      # long-lived AWS key. (Or add AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets and pass them as env instead.)
      # - uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: arn:aws:iam::123456789012:role/complyrobin-runner
      #     aws-region: us-east-1

      # Rotating Google Cloud keys, or writing to Google secrets, without a key file? Remove the # signs below, and
      # pass steps.google.outputs.access_token as google-cloud-access-token.
      # - uses: google-github-actions/auth@v2
      #   id: google
      #   with:
      #     workload_identity_provider: projects/123456789/locations/global/workloadIdentityPools/github/providers/github
      #     service_account: complyrobin-runner@your-project.iam.gserviceaccount.com
      #     token_format: access_token

      - uses: complyrobin/runner@v0
        with:
          command: ${{ inputs.command || 'run' }}
          token: ${{ secrets.COMPLYROBIN_TOKEN }}
          openai-admin-key: ${{ secrets.OPENAI_ADMIN_KEY }}
          google-cloud-credentials: ${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}
          laravel-cloud-token: ${{ secrets.LARAVEL_CLOUD_API_TOKEN }}
          github-secrets-token: ${{ secrets.GH_SECRETS_TOKEN }}
          forge-token: ${{ secrets.FORGE_API_TOKEN }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
